{% extends 'base.html' %}
{% block title %}{{ 'Tambah' if mode == 'tambah' else 'Edit' }} Buku{% endblock %}
{% block content %}
<h3 class="mb-3">{{ 'Tambah' if mode == 'tambah' else 'Edit' }} Buku</h3>
{% include '_errors.html' %}

<form method="post" class="card card-body">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">ID Buku</label>
            <input type="text" name="id_buku" class="form-control" maxlength="4"
                   value="{{ buku.id_buku }}" {{ 'readonly' if mode == 'edit' }} required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Judul</label>
            <input type="text" name="judul" class="form-control" maxlength="100"
                   value="{{ buku.judul }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Pengarang</label>
            <input type="text" name="pengarang" class="form-control" maxlength="50"
                   value="{{ buku.pengarang }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Penerbit</label>
            <input type="text" name="penerbit" class="form-control" maxlength="50"
                   value="{{ buku.penerbit or '' }}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Tahun Terbit</label>
            <input type="number" name="tahun_terbit" class="form-control" min="1900" max="2100"
                   value="{{ buku.tahun_terbit or '' }}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Stok</label>
            <input type="number" name="stok" class="form-control" min="0"
                   value="{{ buku.stok }}" required>
        </div>
    </div>
    <div>
        <button type="submit" class="btn btn-primary">Simpan</button>
        <a href="{{ url_for('buku.index') }}" class="btn btn-secondary">Batal</a>
    </div>
</form>
{% endblock %}
