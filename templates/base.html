<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Perpustakaan{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Perpustakaan</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('buku.index') }}">Buku</a>
            <a class="nav-link" href="{{ url_for('peminjaman.index') }}">Peminjaman</a>
        </div>
    </div>
</nav>
<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for kategori, pesan in messages %}
        <div class="alert alert-{{ kategori }}">{{ pesan }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
<footer class="container text-center text-muted small py-4">
    Sistem Informasi Perpustakaan &middot; Praktikum Basis Data
</footer>
</body>
</html>
