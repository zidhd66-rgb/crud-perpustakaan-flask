{% extends 'base.html' %}
{% block title %}Pinjam Buku{% endblock %}
{% block content %}
<h3 class="mb-3">Pinjam Buku</h3>
{% include '_errors.html' %}

<form method="post" class="card card-body">
    <div class="mb-3">
        <label class="form-label">Anggota</label>
        <select name="id_anggota" class="form-select" required>
            <option value="">-- pilih anggota --</option>
            {% for a in anggota %}
                <option value="{{ a.id_anggota }}" {{ 'selected' if a.id_anggota == data.id_anggota }}>
                    {{ a.id_anggota }} - {{ a.nama }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Buku (hanya yang stoknya tersedia)</label>
        <select name="id_buku" class="form-select" required>
            <option value="">-- pilih buku --</option>
            {% for b in buku %}
                <option value="{{ b.id_buku }}" {{ 'selected' if b.id_buku == data.id_buku }}>
                    {{ b.judul }} (stok {{ b.stok }})
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Tanggal Pinjam</label>
        <input type="date" name="tgl_pinjam" class="form-control"
               value="{{ data.tgl_pinjam }}" required>
    </div>
    <div>
        <button class="btn btn-primary">Simpan</button>
        <a href="{{ url_for('peminjaman.index') }}" class="btn btn-secondary">Batal</a>
    </div>
</form>
{% endblock %}
